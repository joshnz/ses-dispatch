{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SES Crew Screen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/crew-screen.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#E65100">
</head>
<body class="crew-screen-body">
    <div class="container-fluid p-2">
        <!-- Crew selector -->
        <div class="crew-selector mb-3">
            <label for="crew-select" class="form-label text-white">Select Crew:</label>
            <select id="crew-select" class="form-select"
                    onchange="window.location.href='?crew=' + this.value">
                <option value="">-- Select crew --</option>
                {% for c in crews %}
                <option value="{{ c.pk }}" {% if crew and crew.pk == c.pk %}selected{% endif %}>
                    {{ c.callsign }} ({{ c.vehicle_type }})
                </option>
                {% endfor %}
            </select>
        </div>

        {% if crew %}
        <div id="crew-content"
             hx-get="/htmx/crew-screen-content/{{ crew.pk }}/"
             hx-trigger="dispatch-changed"
             hx-swap="innerHTML">
            {% include "dispatch/partials/crew_screen_content.html" %}
        </div>
        {% else %}
        <div class="text-center text-white mt-5">
            <h4>Select your crew above to begin</h4>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="{% static 'js/sse.js' %}"></script>
</body>
</html>
