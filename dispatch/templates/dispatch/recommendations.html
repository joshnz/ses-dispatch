{% extends "dispatch/base.html" %}

{% block title %}Recommendations - SES Dispatch{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Dispatch Board</h5>
        <button class="btn btn-sm btn-outline-light"
                hx-get="/htmx/recommendations-board/"
                hx-target="#rec-board"
                hx-swap="innerHTML">Refresh</button>
    </div>
</div>

<div id="rec-board"
     hx-get="/htmx/recommendations-board/"
     hx-trigger="dispatch-changed"
     hx-swap="innerHTML">
    {% include "dispatch/partials/recommendations_board.html" %}
</div>

<div id="modal-container"></div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    var csrfToken = '{{ csrf_token }}';

    function postAction(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: body || ''
        });
    }

    function showActionToast(message, type) {
        var container = document.getElementById('toast-container');
        if (!container) return;
        var bgClass = type === 'success' ? 'text-bg-success' : 'text-bg-info';
        var toast = document.createElement('div');
        toast.className = 'toast align-items-center ' + bgClass + ' border-0 show';
        toast.setAttribute('role', 'alert');
        toast.innerHTML =
            '<div class="d-flex">' +
            '<div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
            '</div>';
        container.appendChild(toast);
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, 4000);
    }

    function refreshBoard() {
        htmx.trigger(document.body, 'dispatch-changed');
    }

    // Delegated event listeners on #rec-board (works after HTMX swaps)
    document.getElementById('rec-board').addEventListener('click', function(e) {
        var btn;

        // Complete / simple action buttons
        btn = e.target.closest('.rec-action-btn');
        if (btn) {
            var action = btn.getAttribute('data-action');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            postAction(action).then(function() {
                showActionToast('Job completed', 'success');
                refreshBoard();
            });
            return;
        }

        // Dispatch buttons
        btn = e.target.closest('.rec-dispatch-btn');
        if (btn) {
            var jobId = btn.getAttribute('data-job-id');
            var crewId = btn.getAttribute('data-crew-id');
            btn.disabled = true;
            btn.textContent = 'Dispatching...';
            postAction('/action/dispatch/', 'job_id=' + jobId + '&crew_id=' + crewId + '&confirmed=1')
                .then(function() {
                    showActionToast('Crew dispatched', 'success');
                    refreshBoard();
                });
            return;
        }

        // Return to base buttons
        btn = e.target.closest('.rec-rtb-btn');
        if (btn) {
            var rtbCrewId = btn.getAttribute('data-crew-id');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            postAction('/action/return-to-base/' + rtbCrewId + '/')
                .then(function(resp) { return resp.text(); })
                .then(function(html) {
                    if (html.indexOf('rtb-modal-wrapper') !== -1) {
                        document.getElementById('modal-container').innerHTML = html;
                        btn.disabled = false;
                        btn.textContent = 'Return to Base';
                    } else {
                        showActionToast('Crew returning to base', 'success');
                        refreshBoard();
                    }
                });
            return;
        }

        // Queue buttons
        btn = e.target.closest('.rec-queue-btn');
        if (btn) {
            var qCrewId = btn.getAttribute('data-crew-id');
            var qJobId = btn.getAttribute('data-job-id');
            btn.disabled = true;
            btn.textContent = 'Queuing...';
            postAction('/action/queue/' + qCrewId + '/add/', 'job_id=' + qJobId)
                .then(function() {
                    showActionToast('Job queued', 'success');
                    refreshBoard();
                });
            return;
        }
    });
})();
</script>
{% endblock %}
