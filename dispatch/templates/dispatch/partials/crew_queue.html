{% with queue=crew.job_queue.all %}
{% if queue.count > 1 %}
<div class="job-queue mt-2">
    <small class="text-muted">Queue ({{ queue.count|add:"-1" }} upcoming):</small>
    <ol class="queue-list list-group list-group-flush list-group-numbered"
        hx-post="/action/reorder-queue/{{ crew.pk }}/"
        hx-trigger="end" hx-swap="none">
        {% for entry in queue %}
        {% if entry.position > 0 %}
        <li class="list-group-item py-1 px-2 d-flex justify-content-between align-items-center"
            data-job-id="{{ entry.job.pk }}"
            data-position="{{ entry.position }}">
            <span>
                <span class="badge bg-priority-{{ entry.job.priority }}">
                    P{{ entry.job.priority }}
                </span>
                {{ entry.job.sierra_number }}
            </span>
            <button class="btn btn-sm btn-outline-danger"
                    hx-delete="/action/queue/{{ crew.pk }}/{{ entry.job.pk }}/"
                    hx-target="#crew-{{ crew.pk }}"
                    hx-swap="outerHTML">
                &times;
            </button>
        </li>
        {% endif %}
        {% endfor %}
    </ol>
</div>
{% endif %}
{% endwith %}
