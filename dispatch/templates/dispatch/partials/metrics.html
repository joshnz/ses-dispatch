<div class="row g-3">
    <div class="col-6 col-md-3">
        <div class="card metric-card metric-pending text-center">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ pending_count }}</h3>
                <small>Pending Jobs</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card metric-card metric-active text-center">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ active_count }}</h3>
                <small>Active Jobs</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card metric-card metric-available text-center">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ available_crews }}</h3>
                <small>Available Crews</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card metric-card metric-dispatched text-center">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ dispatched_crews }}</h3>
                <small>Dispatched Crews</small>
            </div>
        </div>
    </div>
</div>
