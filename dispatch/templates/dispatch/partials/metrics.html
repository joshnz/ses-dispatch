<div class="row g-3">
    <div class="col-6 col-md-3">
        <div class="card text-center border-warning">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ pending_count }}</h3>
                <small class="text-muted">Pending Jobs</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center border-info">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ active_count }}</h3>
                <small class="text-muted">Active Jobs</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center border-success">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ available_crews }}</h3>
                <small class="text-muted">Available Crews</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card text-center border-primary">
            <div class="card-body py-2">
                <h3 class="mb-0">{{ dispatched_crews }}</h3>
                <small class="text-muted">Dispatched Crews</small>
            </div>
        </div>
    </div>
</div>
