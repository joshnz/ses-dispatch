<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos - VicSES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #E65100; min-height: 100vh; }
        .upload-card { max-width: 500px; margin: 20px auto; }
        .preview-img { max-height: 200px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-card card">
            <div class="card-header text-center" style="background-color: #E65100; color: white;">
                <h4>VicSES Photo Upload</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Location:</strong> {{ job_address }}
                </div>
                <p class="text-muted">{{ remaining }} upload{{ remaining|pluralize }} remaining</p>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Photo</label>
                        {{ form.image }}
                    </div>

                    <div id="preview-container" style="display:none" class="text-center mb-3">
                        <img id="preview" class="preview-img img-thumbnail">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        {{ form.description }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Name (optional)</label>
                        {{ form.uploaded_by_name }}
                    </div>

                    {{ form.geo_lat }}
                    {{ form.geo_lng }}

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Upload Photo
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Image preview
        document.querySelector('input[type="file"]').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Geolocation capture
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                document.querySelector('[name="geo_lat"]').value = pos.coords.latitude;
                document.querySelector('[name="geo_lng"]').value = pos.coords.longitude;
            });
        }
    </script>
</body>
</html>
