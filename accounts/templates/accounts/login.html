{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SES Dispatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #E65100 0%, #bf4500 50%, #1a2332 100%);
            background-attachment: fixed;
        }
        .login-card {
            width: 420px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            overflow: hidden;
            border: none;
        }
        .login-header {
            background-color: #1a2332;
            color: white;
            text-align: center;
            padding: 2rem 1.5rem 1.5rem;
        }
        .login-header h4 {
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .login-header p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 0;
        }
        .login-logo {
            width: 56px;
            height: 56px;
            background-color: #E65100;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 12px rgba(230,81,0,0.3);
        }
        .login-body {
            padding: 2rem 1.5rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #666;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            border: 2px solid #e0e0e0;
            transition: border-color 0.15s ease;
        }
        .form-control:focus {
            border-color: #E65100;
            box-shadow: 0 0 0 3px rgba(230,81,0,0.1);
        }
        .btn-login {
            background-color: #E65100;
            border-color: #E65100;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.65rem;
            font-size: 1rem;
            transition: background-color 0.15s ease;
        }
        .btn-login:hover {
            background-color: #bf4500;
            border-color: #bf4500;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                </svg>
            </div>
            <h4>VicSES Dispatch</h4>
            <p>Incident Command Planning Tool</p>
        </div>
        <div class="login-body">
            {% if form.errors %}
            <div class="alert alert-danger" style="border-radius:8px; font-size:0.9rem;">
                Invalid username or password.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username"
                           class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password"
                           class="form-control" required>
                </div>
                <button type="submit" class="btn btn-login w-100">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
